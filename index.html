<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOMICS DB Updater</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
:root{
  --bg:#07080f;--s1:#0f1018;--s2:#161720;--s3:#1e1f2e;
  --bd:#252638;--bd2:#2e2f45;
  --p:#6366f1;--p2:#818cf8;--g:#10b981;--o:#f59e0b;--r:#ef4444;--b:#3b82f6;
  --t:#f1f1f6;--t2:#9ca3c4;--t3:#5c5e7a;--rr:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t);font-size:13px;line-height:1.5;}
header{background:var(--s1);border-bottom:1px solid var(--bd);padding:11px 20px;display:flex;align-items:center;gap:10px;}
.logo{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--p2);}
.logo em{color:var(--o);font-style:normal;}
.logo sup{font-size:9px;color:var(--g);vertical-align:super;}
.hd{font-size:11px;color:var(--t3);margin-top:1px;}
.wrap{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 51px);}
.panel{display:flex;flex-direction:column;overflow:hidden;}
.left{background:var(--s1);border-right:1px solid var(--bd);}
.ph{padding:10px 16px;border-bottom:1px solid var(--bd);font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);display:flex;align-items:center;gap:6px;background:var(--s1);}
.dot{width:5px;height:5px;border-radius:50%;background:var(--g);}
.sc{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.tabs{display:flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden;}
.tab{flex:1;padding:8px;text-align:center;cursor:pointer;font-size:11px;color:var(--t3);background:var(--s2);border:none;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.tab.on{background:var(--p);color:#fff;}
.url-list{display:flex;flex-direction:column;gap:6px;min-height:10px;}
.url-row{display:flex;gap:6px;align-items:center;}
.url-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--t3);width:16px;flex-shrink:0;text-align:right;}
.url-inp{flex:1;background:var(--s2);border:1px solid var(--bd2);border-radius:6px;color:var(--t);font-size:11px;padding:8px 10px;outline:none;transition:border-color .2s;}
.url-inp:focus{border-color:var(--p);}
.url-inp::placeholder{color:var(--t3);}
.url-del{background:none;border:none;cursor:pointer;color:var(--t3);font-size:14px;padding:2px 4px;}
.url-del:hover{color:var(--r);}
.url-add{background:var(--s2);border:1px solid var(--bd2);border-radius:6px;color:var(--t2);padding:7px;cursor:pointer;font-size:11px;width:100%;font-family:'Noto Sans KR',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s;}
.url-add:hover{border-color:var(--p);color:var(--t);}
.fetch-btn{background:var(--p);color:#fff;border:none;border-radius:6px;padding:9px;cursor:pointer;font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:600;width:100%;transition:all .2s;}
.fetch-btn:hover:not(:disabled){background:#4f52d9;}
.fetch-btn:disabled{opacity:.4;cursor:not-allowed;}
.fetched-list{display:flex;flex-direction:column;gap:5px;}
.fetched-item{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;}
.fetched-item.ok{border-color:rgba(16,185,129,.3);}
.fetched-item.fail{border-color:rgba(239,68,68,.3);}
.fi-url{font-size:10px;color:var(--t3);font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.fi-preview{font-size:11px;color:var(--t2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.fi-imgs{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.fi-img{width:44px;height:44px;border-radius:4px;object-fit:cover;border:1px solid var(--bd);}
textarea{background:var(--s2);border:1px solid var(--bd2);border-radius:var(--rr);color:var(--t);font-family:'Noto Sans KR',sans-serif;font-size:12px;padding:11px;resize:none;outline:none;line-height:1.8;transition:border-color .2s;min-height:200px;width:100%;}
textarea:focus{border-color:var(--p);}
textarea::placeholder{color:var(--t3);}
.ch2{font-size:10px;color:var(--t3);text-align:right;}
label.ck{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--t2);cursor:pointer;}
label.ck input{accent-color:var(--p);width:12px;height:12px;}
.rb{background:var(--p);color:#fff;border:none;border-radius:7px;padding:11px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;}
.rb:hover:not(:disabled){background:#4f52d9;transform:translateY(-1px);}
.rb:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.right{background:var(--bg);display:flex;flex-direction:column;}
.rh{padding:9px 16px;border-bottom:1px solid var(--bd);background:var(--s1);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.rht{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;}
.cba{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:10px;}
.cnb{background:rgba(16,185,129,.13);color:var(--g);border:1px solid rgba(16,185,129,.28);}
.cdb{background:rgba(245,158,11,.13);color:var(--o);border:1px solid rgba(245,158,11,.28);}
.rt{margin-left:auto;display:flex;gap:6px;}
.tb{background:var(--s2);border:1px solid var(--bd2);color:var(--t2);padding:5px 10px;border-radius:5px;cursor:pointer;font-size:11px;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.tb:hover{border-color:var(--p);color:var(--t);}
.tb.pr{background:var(--g);color:#fff;border-color:var(--g);}
.res{flex:1;overflow-y:auto;padding:12px;}
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--t3);}
.ei{font-size:38px;opacity:.2;}.et{font-size:12px;color:var(--t2);}
.ed{font-size:11px;text-align:center;max-width:240px;line-height:1.9;}
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;}
.sp{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.lt{font-size:12px;color:var(--t2);text-align:center;max-width:260px;}
.ls{font-size:11px;color:var(--t3);}
.cards{display:flex;flex-direction:column;gap:8px;}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rr);overflow:hidden;transition:border-color .2s;}
.card:hover{border-color:var(--bd2);}
.card.nc{border-left:3px solid var(--g);}
.card.dc{border-left:3px solid var(--o);opacity:.7;}
.ps{height:2px;width:100%;}
.pS{background:var(--r);}.pA{background:var(--p);}.pB{background:var(--b);}.pC{background:var(--bd);}
.ct{display:flex;align-items:center;gap:10px;padding:11px 12px 8px;}
.av{width:40px;height:40px;border-radius:8px;overflow:hidden;background:rgba(99,102,241,.18);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;position:relative;}
.av img{width:100%;height:100%;object-fit:cover;}
.sb{position:absolute;bottom:-2px;right:-2px;width:13px;height:13px;border-radius:50%;background:var(--g);border:2px solid var(--s1);font-size:7px;display:flex;align-items:center;justify-content:center;}
.ci{flex:1;min-width:0;}
.cn2{font-size:13px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cs{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.ca{display:flex;gap:5px;flex-shrink:0;}
.ab{border:none;border-radius:5px;padding:4px 8px;cursor:pointer;font-size:10px;font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
.ao{background:rgba(16,185,129,.14);color:var(--g);border:1px solid rgba(16,185,129,.28);}
.ao:hover{background:rgba(16,185,129,.3);}
.af{background:var(--s3);color:var(--t3);border:1px solid var(--bd);}
.af:hover{color:var(--r);}
.dbx{background:rgba(245,158,11,.1);color:var(--o);border:1px solid rgba(245,158,11,.2);border-radius:5px;padding:3px 7px;font-size:10px;}
.ir{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px;}
.it{display:inline-flex;align-items:center;gap:4px;background:var(--s2);border-radius:5px;padding:4px 8px;font-size:11px;}
.il{color:var(--t3);font-size:10px;}.iv{color:var(--t2);}
.iv.em{color:var(--p2);}.iv.gv{color:var(--g);font-family:'IBM Plex Mono',monospace;font-size:10px;}
.ef{display:flex;align-items:center;gap:6px;background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);border-radius:5px;padding:5px 10px;margin:0 12px 8px;font-size:11px;}
.el{color:var(--t3);font-size:10px;flex-shrink:0;}.ev2{color:var(--g);font-family:'IBM Plex Mono',monospace;font-size:11px;}
.tg{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px;}
.tgi{padding:2px 6px;border-radius:4px;font-size:10px;border:1px solid var(--bd);color:var(--t3);}
.tg-p{color:var(--p2);border-color:rgba(99,102,241,.3);background:rgba(99,102,241,.07);}
.tg-g{color:var(--g);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.07);}
.tg-o{color:var(--o);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.07);}
.sm{border-top:1px solid var(--bd);padding:8px 12px 10px;background:rgba(59,130,246,.03);}
.sm-h{display:flex;align-items:center;gap:5px;margin-bottom:5px;}
.sm-l{font-size:9px;color:var(--b);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.5px;}
.sm-b{font-size:8px;padding:1px 4px;border-radius:3px;background:rgba(59,130,246,.1);color:var(--b);border:1px solid rgba(59,130,246,.2);}
.sm-t{font-size:11px;color:var(--t2);line-height:1.8;}
.hl{color:var(--o);}.kr{color:var(--p2);}
.err{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-radius:7px;padding:12px;color:#fca5a5;font-size:12px;margin:12px;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">KOMICS <em>DB</em> Updater<sup>v6</sup></div>
    <div class="hd">뉴스레터 URL(복수) 또는 텍스트 → 바이어 추출 + 웹검색 최신정보</div>
  </div>
</header>
<div class="wrap">
  <div class="panel left">
    <div class="ph"><div class="dot"></div>입력</div>
    <div class="sc">
      <div class="tabs">
        <button class="tab on" id="tab-url" onclick="switchTab('url')">🔗 URL 입력</button>
        <button class="tab" id="tab-text" onclick="switchTab('text')">📋 텍스트 붙여넣기</button>
      </div>
      <div id="area-url" style="display:flex;flex-direction:column;gap:8px;">
        <div class="url-list" id="urlList"></div>
        <button class="url-add" onclick="addUrl()">＋ URL 추가</button>
        <button class="fetch-btn" id="fetchBtn" onclick="fetchAll()">📥 페이지 가져오기</button>
        <div id="fetchedList" class="fetched-list"></div>
      </div>
      <div id="area-text" style="display:none;flex-direction:column;gap:6px;">
        <textarea id="textInp" placeholder="뉴스레터 텍스트를 붙여넣으세요." rows="10"></textarea>
        <div class="ch2" id="cc">0자</div>
      </div>
      <label class="ck"><input type="checkbox" id="cs" checked>🔍 웹검색으로 최신정보 보완</label>
      <label class="ck"><input type="checkbox" id="ck2" checked>🇰🇷 한국 콘텐츠 관련성 분석</label>
      <label class="ck"><input type="checkbox" id="cpr" checked>⭐ 우선순위 판별 (S/A/B/C)</label>
      <button class="rb" id="rb" onclick="run()">⚡ 바이어 정보 추출</button>
    </div>
  </div>
  <div class="panel right">
    <div class="rh">
      <div class="rht">추출 결과</div>
      <span class="cba cnb" id="cnn" style="display:none">신규 0건</span>
      <span class="cba cdb" id="cdd" style="display:none">중복 0건</span>
      <div class="rt" id="rt" style="display:none">
        <button class="tb" onclick="selAll()">전체 선택</button>
        <button class="tb pr" onclick="exportCsv()" id="eb">✓ 선택 0건 CSV</button>
      </div>
    </div>
    <div class="res" id="res">
      <div class="es">
        <div class="ei">📬</div>
        <div class="et">URL 또는 텍스트로 분석 시작</div>
        <div class="ed">바이어 정보 자동 추출 후<br>웹검색으로 최신정보 반영</div>
      </div>
    </div>
  </div>
</div>
<script>
var items = [], sel = new Set(), fetchedPages = [], currentTab = 'url', urlCount = 0;

function switchTab(t) {
  currentTab = t;
  document.getElementById('tab-url').className = 'tab' + (t === 'url' ? ' on' : '');
  document.getElementById('tab-text').className = 'tab' + (t === 'text' ? ' on' : '');
  document.getElementById('area-url').style.display = t === 'url' ? 'flex' : 'none';
  document.getElementById('area-text').style.display = t === 'text' ? 'flex' : 'none';
}

function addUrl() {
  urlCount++;
  var list = document.getElementById('urlList');
  var row = document.createElement('div');
  row.className = 'url-row';
  row.id = 'urlrow-' + urlCount;
  var num = document.createElement('span');
  num.className = 'url-num';
  num.textContent = list.children.length + 1;
  var inp = document.createElement('input');
  inp.className = 'url-inp';
  inp.placeholder = 'https://animationmagazine.net/...';
  inp.type = 'url';
  inp.id = 'url-' + urlCount;
  var del = document.createElement('button');
  del.className = 'url-del';
  del.textContent = '✕';
  del.onclick = function() { delUrl('urlrow-' + urlCount); };
  row.appendChild(num); row.appendChild(inp); row.appendChild(del);
  list.appendChild(row);
  inp.focus();
}

function delUrl(id) {
  var el = document.getElementById(id);
  if (el) el.remove();
  document.querySelectorAll('.url-row').forEach(function(r, i) {
    var n = r.querySelector('.url-num');
    if (n) n.textContent = i + 1;
  });
}

function getUrls() {
  return Array.from(document.querySelectorAll('.url-inp')).map(function(i) {
    return i.value.trim();
  }).filter(Boolean);
}

document.getElementById('textInp').addEventListener('input', function() {
  document.getElementById('cc').textContent = this.value.length.toLocaleString() + '자';
});

// 서버 호출
async function callServer(body, ms) {
  ms = ms || 30000;
  var ctrl = new AbortController();
  var timer = setTimeout(function() { ctrl.abort(); }, ms);
  try {
    var r = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
    var d = await r.json();
    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
    return d;
  } finally {
    clearTimeout(timer);
  }
}

function parseJSON(text) {
  if (!text) return {};
  text = text.replace(/```json|```/g, '').trim();
  var m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('JSON 없음');
  return JSON.parse(m[0]);
}

function setLoading(t, s) {
  document.getElementById('res').innerHTML =
    '<div class="ld"><div class="sp"></div><div class="lt">' + t + '</div>' +
    (s ? '<div class="ls">' + s + '</div>' : '') + '</div>';
}

function showErr(m) {
  document.getElementById('res').innerHTML =
    '<div class="err">❌ ' + m + '<br><small style="opacity:.7;margin-top:4px;display:block">다시 시도해주세요.</small></div>';
}

// URL 페치
async function fetchAll() {
  var urls = getUrls();
  if (!urls.length) { alert('URL을 입력해주세요.'); return; }
  var btn = document.getElementById('fetchBtn');
  btn.disabled = true; btn.textContent = '⏳ 가져오는 중...';
  document.getElementById('fetchedList').innerHTML = '';
  try {
    var d = await callServer({ type: 'urls', urls: urls }, 30000);
    fetchedPages = d.pages || [];
    renderFetched();
  } catch(e) {
    document.getElementById('fetchedList').innerHTML = '<div class="err" style="margin:0">❌ ' + e.message + '</div>';
  }
  btn.disabled = false; btn.textContent = '📥 페이지 가져오기';
}

function renderFetched() {
  var el = document.getElementById('fetchedList');
  el.innerHTML = fetchedPages.map(function(p) {
    var cls = p.ok ? 'ok' : 'fail';
    var icon = p.ok ? '✅' : '❌';
    var preview = p.ok ? (p.text || '').slice(0, 100) + '...' : (p.error || '');
    var imgs = '';
    if (p.ok && p.images) {
      p.images.slice(0, 4).forEach(function(img) {
        var src = img.url || img;
        imgs += '<img class="fi-img" src="' + src + '" onerror="this.style.display=\'none\'" alt="">';
      });
    }
    return '<div class="fetched-item ' + cls + '">' +
      icon + ' <div style="flex:1;min-width:0"><div class="fi-url">' + p.url + '</div>' +
      '<div class="fi-preview">' + preview + '</div>' +
      (imgs ? '<div class="fi-imgs">' + imgs + '</div>' : '') +
      '</div></div>';
  }).join('');
}

// 메인 실행
async function run() {
  var doS = document.getElementById('cs').checked;
  var doK = document.getElementById('ck2').checked;
  var doPr = document.getElementById('cpr').checked;
  var btn = document.getElementById('rb');
  btn.disabled = true; btn.textContent = '⏳ 분석 중...';

  var allContent = [], allImages = [];

  if (currentTab === 'url') {
    if (!fetchedPages.length) {
      var urls = getUrls();
      if (!urls.length) {
        alert('URL을 입력하고 "페이지 가져오기"를 먼저 눌러주세요.');
        btn.disabled = false; btn.textContent = '⚡ 바이어 정보 추출'; return;
      }
      await fetchAll();
    }
    fetchedPages.filter(function(p) { return p.ok; }).forEach(function(p) {
      if (p.text) allContent.push('[출처: ' + p.url + ']\n' + p.text);
      if (p.images) p.images.forEach(function(img) { allImages.push(img); });
    });
  } else {
    var t = document.getElementById('textInp').value.trim();
    if (!t) { alert('내용을 입력해주세요.'); btn.disabled = false; btn.textContent = '⚡ 바이어 정보 추출'; return; }
    allContent.push(t);
  }

  if (!allContent.length) { showErr('분석할 내용이 없습니다.'); btn.disabled = false; btn.textContent = '⚡ 바이어 정보 추출'; return; }

  setLoading('바이어 정보 추출 중...');

  // URL별로 8000자씩 개별 추출 후 합치기
  var combinedText = allContent.map(function(c) { return c.slice(0, 8000); }).join('\n\n---\n\n').slice(0, 20000);
  var p1 = '만화웹툰 산업 전문 분석가입니다. 아래 내용에서 바이어/담당자 정보를 모두 빠짐없이 추출하여 JSON만 반환 (마크다운 금지):\n' +
    '{"buyers":[{"name":"담당자 이름 또는 null","company":"기업명","title":"직함 또는 null","email":"이메일(명시된 경우만, 없으면 null)","website":"웹사이트 또는 null","country":"국가","buyerType":"만화 출판사|웹툰 플랫폼|OTT/스트리밍|방송사|애니메이션 스튜디오|영화·드라마 제작사|IP 에이전시 중 하나","contentFocus":"콘텐츠 관심분야","dealTypeWebtoon":"딜유형 또는 null","genreInterest":"장르 또는 null","interestKContent":"' + (doK ? 'Y 또는 N' : 'N') + '","kContentNote":"한국콘텐츠 근거 또는 null","priorityTier":"' + (doPr ? 'S|A|B|C' : 'C') + '","languageMarket":"영어권(북미)|영어권(영국/유럽)|불어권|독어권(DACH)|일본어권|글로벌 중 하나","eventMatch":"USA|France|Germany 중 해당(/ 구분)","source":"출처","isDuplicate":false}]}\n' +
    '내용:\n' + combinedText;

  var buyers = [];
  try {
    var r1 = await callServer({ type: 'text', prompt: p1 }, 55000);
    buyers = (parseJSON(r1.result).buyers || []).filter(function(b) {
      // 이름도 없고 이메일도 없으면 제외 (담당자 미상 + 연락처 없음)
      return b.name || b.email;
    });
  } catch(e) {
    showErr('추출 오류: ' + e.message);
    btn.disabled = false; btn.textContent = '⚡ 바이어 정보 추출'; return;
  }

  // 웹검색 - 전체 한 번에
  if (doS && buyers.length > 0) {
    setLoading('웹검색 중...', buyers.length + '명 정보 검색 (최대 55초)');
    var buyerList = buyers.map(function(b, i) {
      return '[' + (i+1) + '] ' + (b.name || '이름없음') + ' / ' + (b.company || '') + ' / ' + (b.title || '');
    }).join('\n');

    var bp = '다음 ' + buyers.length + '명을 웹 검색하여 최신 정보를 찾아주세요.\n\n' +
      '[절대 규칙]\n' +
      '1. 웹 검색으로 직접 확인된 사실만 작성\n' +
      '2. 확인 안 되면 반드시 null\n' +
      '3. 추측/추론 절대 금지\n' +
      '4. 모든 텍스트는 한국어, 날짜(년/월) 포함\n\n' +
      '검색 대상:\n' + buyerList + '\n\n' +
      '응답 형식 (JSON만, 다른 텍스트 없이):\n' +
      '{"results":[{"index":1,"recentNews":"확인된 뉴스(날짜포함) 또는 null","jobChange":"이직/승진(날짜포함) 또는 null","companyUpdate":"회사동향(날짜포함) 또는 null","kContentLink":"한국콘텐츠협업 또는 null","email":"공식이메일 또는 null","photoUrl":"프로필사진URL 또는 null"},{"index":2}]}';

    try {
      var rb = await callServer({ type: 'text', prompt: bp, useSearch: true }, 55000);
      var parsed = parseJSON(rb.result);
      var results = parsed.results || [];
      results.forEach(function(r) {
        var idx = (r.index || 1) - 1;
        if (idx >= 0 && idx < buyers.length) {
          buyers[idx]._si = r;
          if (r.email && !buyers[idx].email) buyers[idx].email = r.email;
          if (r.photoUrl && !buyers[idx]._ph) buyers[idx]._ph = r.photoUrl;
        }
      });
    } catch(e) {
      console.warn('웹검색 실패:', e.message);
    }
  }

  // 이미지 매칭
  buyers.forEach(function(b) {
    if (b._ph || !b.name) return;
    var nl = b.name.toLowerCase();
    var parts = nl.split(' ').filter(function(p) { return p.length > 2; });
    var matched = allImages.find(function(img) {
      var cap = ((img.caption || img) + '').toLowerCase();
      if (!cap) return false;
      var cnt = parts.filter(function(p) { return cap.includes(p); }).length;
      return cnt >= Math.min(2, parts.length);
    });
    if (matched) b._nlImg = matched.url || matched;
  });

  items = buyers.map(function(b, i) { b._id = i; return b; });
  sel = new Set(items.filter(function(b) { return !b.isDuplicate; }).map(function(b) { return b._id; }));
  render();
  btn.disabled = false; btn.textContent = '⚡ 바이어 정보 추출';
}

function render() {
  var ni = items.filter(function(b) { return !b.isDuplicate; });
  var di = items.filter(function(b) { return b.isDuplicate; });
  document.getElementById('cnn').textContent = '신규 ' + ni.length + '건';
  document.getElementById('cdd').textContent = '중복 ' + di.length + '건';
  document.getElementById('cnn').style.display = ni.length ? 'inline' : 'none';
  document.getElementById('cdd').style.display = di.length ? 'inline' : 'none';
  document.getElementById('rt').style.display = items.length ? 'flex' : 'none';
  if (!items.length) {
    document.getElementById('res').innerHTML = '<div class="es"><div class="ei">🔍</div><div class="et">추출된 바이어가 없습니다</div></div>';
    return;
  }
  var ic = {'만화 출판사':'📚','웹툰 플랫폼':'📱','OTT/스트리밍':'📺','방송사':'📡','애니메이션 스튜디오':'🎬','영화·드라마 제작사':'🎥','IP 에이전시':'🏷️'};
  var pc = {S:'pS',A:'pA',B:'pB',C:'pC'};
  var pl = {S:'S급 최우선',A:'A급 우선',B:'B급',C:'C급'};

  var html = items.map(function(b) {
    var si = b._si || {};
    var icon = ic[b.buyerType] || '🏢';
    var photoSrc = b._ph || b._nlImg;
    var av = photoSrc
      ? '<div class="av"><img src="' + photoSrc + '" onerror="this.parentElement.innerHTML=\'' + icon + '\'" alt=""><div class="sb">' + (b._ph ? '🔍' : '📰') + '</div></div>'
      : '<div class="av">' + icon + '</div>';

    var infoData = [
      ['기업', b.company, 'em'], ['직함', b.title, ''],
      ['국가', b.country, ''], ['행사', b.eventMatch, 'gv'],
      ['바이어유형', b.buyerType, ''], ['딜유형', b.dealTypeWebtoon, ''],
      ['장르', b.genreInterest, '']
    ].filter(function(f) { return f[1]; });

    var infoHtml = infoData.map(function(f) {
      return '<div class="it"><span class="il">' + f[0] + '</span><span class="iv ' + f[2] + '">' + f[1] + '</span></div>';
    }).join('');

    var emHtml = b.email
      ? '<div class="ef"><span class="el">✉</span><span class="ev2">' + b.email + '</span></div>' : '';

    var tags = [];
    if (b.interestKContent === 'Y') tags.push(['tg-g', '🇰🇷 K-콘텐츠 관심']);
    if (b.priorityTier && b.priorityTier !== 'C') tags.push([b.priorityTier === 'S' ? 'tg-g' : b.priorityTier === 'A' ? 'tg-p' : '', pl[b.priorityTier]]);
    if (si.jobChange) tags.push(['tg-o', '⚡ ' + si.jobChange]);
    var tgHtml = tags.length
      ? '<div class="tg">' + tags.map(function(t) { return '<span class="tgi ' + t[0] + '">' + t[1] + '</span>'; }).join('') + '</div>' : '';

    var ml = [];
    if (si.companyUpdate) ml.push(si.companyUpdate);
    if (si.recentNews) ml.push(si.recentNews);
    if (si.kContentLink) ml.push('<span class="kr">🇰🇷 ' + si.kContentLink + '</span>');
    var memoHtml = ml.length
      ? '<div class="sm"><div class="sm-h"><span class="sm-l">🔍 웹검색 최신정보</span><span class="sm-b">AI 검색</span></div><div class="sm-t">' + ml.join('<br>') + '</div></div>' : '';

    var acts = b.isDuplicate
      ? '<span class="dbx">⚠ 중복확인</span>'
      : '<button class="ab ' + (sel.has(b._id) ? 'ao' : 'af') + '" onclick="toggleSel(' + b._id + ')">' + (sel.has(b._id) ? '✓ 선택' : '+ 추가') + '</button>';

    var srcShort = b.source ? b.source.slice(0, 40) + (b.source.length > 40 ? '...' : '') : '';

    return '<div class="card ' + (b.isDuplicate ? 'dc' : 'nc') + '" id="c' + b._id + '">' +
      '<div class="ps ' + (pc[b.priorityTier] || 'pC') + '"></div>' +
      '<div class="ct">' + av +
      '<div class="ci"><div class="cn2">' + (b.name || '(담당자 미상)') + ' <span style="font-size:10px;color:var(--t3);font-weight:400">@ ' + (b.company || '-') + '</span></div>' +
      '<div class="cs">' + [b.title, srcShort].filter(Boolean).join(' · ') + '</div></div>' +
      '<div class="ca">' + acts + '</div></div>' +
      (infoHtml ? '<div class="ir">' + infoHtml + '</div>' : '') +
      emHtml + tgHtml + memoHtml + '</div>';
  }).join('');

  document.getElementById('res').innerHTML = '<div class="cards">' + html + '</div>';
  updateExpBtn();
}

function toggleSel(id) {
  if (sel.has(id)) sel.delete(id); else sel.add(id);
  var card = document.getElementById('c' + id);
  var btn = card ? card.querySelector('.ab') : null;
  if (btn) {
    if (sel.has(id)) { btn.className = 'ab ao'; btn.textContent = '✓ 선택'; }
    else { btn.className = 'ab af'; btn.textContent = '+ 추가'; }
  }
  updateExpBtn();
}

function selAll() {
  items.filter(function(b) { return !b.isDuplicate; }).forEach(function(b) { sel.add(b._id); });
  render();
}

function updateExpBtn() {
  var btn = document.getElementById('eb');
  if (btn) btn.textContent = '✓ 선택 ' + sel.size + '건 CSV';
}

function exportCsv() {
  var list = items.filter(function(b) { return sel.has(b._id); });
  if (!list.length) { alert('선택된 항목이 없습니다.'); return; }

  var hd = ['NO', 'Nationality', 'Genre', 'Company', 'Company introduce', 'Website', 'E-mail', '담당자', '비고'];
  var rows = list.map(function(b, i) {
    var si = b._si || {};
    var bigo = [];
    if (si.jobChange) bigo.push('⚡ ' + si.jobChange);
    if (si.recentNews) bigo.push(si.recentNews);
    if (si.companyUpdate) bigo.push(si.companyUpdate);
    if (si.kContentLink) bigo.push('🇰🇷 ' + si.kContentLink);
    bigo.push('⚠️ 뉴스레터 자동 추출 — 발송 전 확인 필요');
    var person = [b.name, b.title].filter(Boolean).join(' / ');
    var intro = [b.buyerType, b.contentFocus, b.dealTypeWebtoon].filter(Boolean).join(' | ');
    return {
      'NO': String(i + 1),
      'Nationality': b.country || '',
      'Genre': b.genreInterest || '',
      'Company': b.company || '',
      'Company introduce': intro,
      'Website': b.website || '',
      'E-mail': b.email || '',
      '담당자': person,
      '비고': bigo.join(' / ')
    };
  });

  function esc(v) { return '"' + String(v || '').replace(/"/g, '""') + '"'; }
  var csv = '\uFEFF' + [hd.join(',')].concat(rows.map(function(r) {
    return hd.map(function(h) { return esc(r[h]); }).join(',');
  })).join('\n');

  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'buyers_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
}

// 초기화
addUrl();
</script>
</body>
</html>
