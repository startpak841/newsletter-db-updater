<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOMICS DB Updater</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
:root{
  --bg:#07080f;--s1:#0f1018;--s2:#161720;--s3:#1e1f2e;
  --bd:#252638;--bd2:#2e2f45;
  --p:#6366f1;--p2:#818cf8;--g:#10b981;--o:#f59e0b;--r:#ef4444;--b:#3b82f6;
  --t:#f1f1f6;--t2:#9ca3c4;--t3:#5c5e7a;--rr:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t);font-size:13px;line-height:1.5;}
header{background:var(--s1);border-bottom:1px solid var(--bd);padding:11px 20px;display:flex;align-items:center;gap:10px;}
.logo{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--p2);}
.logo em{color:var(--o);font-style:normal;}
.logo sup{font-size:9px;color:var(--g);vertical-align:super;}
.hd{font-size:11px;color:var(--t3);margin-top:1px;}
.wrap{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 51px);}
.panel{display:flex;flex-direction:column;overflow:hidden;}
.ph{padding:10px 16px;border-bottom:1px solid var(--bd);font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);display:flex;align-items:center;gap:6px;background:var(--s1);}
.dot{width:5px;height:5px;border-radius:50%;background:var(--g);}
.left{background:var(--s1);border-right:1px solid var(--bd);}
.sc{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}

/* 입력 탭 */
.tabs{display:flex;gap:0;border:1px solid var(--bd);border-radius:7px;overflow:hidden;}
.tab{flex:1;padding:8px;text-align:center;cursor:pointer;font-size:11px;color:var(--t3);background:var(--s2);transition:all .2s;border:none;font-family:'Noto Sans KR',sans-serif;}
.tab.on{background:var(--p);color:#fff;}

/* URL 입력 */
.url-wrap{display:flex;gap:6px;}
.url-inp{flex:1;background:var(--s2);border:1px solid var(--bd2);border-radius:7px;color:var(--t);font-size:12px;padding:9px 11px;outline:none;transition:border-color .2s;}
.url-inp:focus{border-color:var(--p);}
.url-inp::placeholder{color:var(--t3);}
.url-btn{background:var(--s2);border:1px solid var(--bd2);color:var(--t2);padding:9px 12px;border-radius:7px;cursor:pointer;font-size:11px;white-space:nowrap;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.url-btn:hover{border-color:var(--p);color:var(--t);}

textarea{background:var(--s2);border:1px solid var(--bd2);border-radius:var(--rr);color:var(--t);font-family:'Noto Sans KR',sans-serif;font-size:12px;padding:11px;resize:none;outline:none;line-height:1.8;transition:border-color .2s;min-height:180px;width:100%;}
textarea:focus{border-color:var(--p);}
textarea::placeholder{color:var(--t3);font-size:12px;}

.fetched-box{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);border-radius:7px;padding:9px 11px;font-size:11px;color:var(--g);display:flex;align-items:center;gap:7px;}
.fetched-url{color:var(--t2);font-size:10px;font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.ch2{font-size:10px;color:var(--t3);text-align:right;}
label.ck{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--t2);cursor:pointer;}
label.ck input{accent-color:var(--p);width:12px;height:12px;cursor:pointer;}
.rb{background:var(--p);color:#fff;border:none;border-radius:7px;padding:11px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;}
.rb:hover:not(:disabled){background:#4f52d9;transform:translateY(-1px);}
.rb:disabled{opacity:.4;cursor:not-allowed;transform:none;}

.right{background:var(--bg);display:flex;flex-direction:column;}
.rh{padding:9px 16px;border-bottom:1px solid var(--bd);background:var(--s1);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.rht{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;}
.cba{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:10px;}
.cn{background:rgba(16,185,129,.13);color:var(--g);border:1px solid rgba(16,185,129,.28);}
.cdd{background:rgba(245,158,11,.13);color:var(--o);border:1px solid rgba(245,158,11,.28);}
.rt{margin-left:auto;display:flex;gap:6px;}
.tb{background:var(--s2);border:1px solid var(--bd2);color:var(--t2);padding:5px 10px;border-radius:5px;cursor:pointer;font-size:11px;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.tb:hover{border-color:var(--p);color:var(--t);}
.tb.pr{background:var(--g);color:#fff;border-color:var(--g);}
.tb.pr:hover{background:#0ea572;}
.res{flex:1;overflow-y:auto;padding:12px;}

.es{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--t3);}
.ei{font-size:38px;opacity:.2;}.et{font-size:12px;color:var(--t2);}
.ed{font-size:11px;text-align:center;max-width:240px;line-height:1.9;}
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;}
.sp{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.lt{font-size:12px;color:var(--t2);text-align:center;max-width:260px;}
.ls{font-size:11px;color:var(--t3);}

.cards{display:flex;flex-direction:column;gap:8px;}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rr);overflow:hidden;transition:border-color .2s;}
.card:hover{border-color:var(--bd2);}
.card.nc{border-left:3px solid var(--g);}
.card.dc{border-left:3px solid var(--o);opacity:.7;}
.ps{height:2px;width:100%;}
.pS{background:var(--r);}.pA{background:var(--p);}.pB{background:var(--b);}.pC{background:var(--bd);}
.ct{display:flex;align-items:center;gap:10px;padding:11px 12px 8px;}
.av{width:40px;height:40px;border-radius:8px;overflow:hidden;background:rgba(99,102,241,.18);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;position:relative;}
.av img{width:100%;height:100%;object-fit:cover;}
.sb{position:absolute;bottom:-2px;right:-2px;width:13px;height:13px;border-radius:50%;background:var(--g);border:2px solid var(--s1);font-size:7px;display:flex;align-items:center;justify-content:center;}
.ci{flex:1;min-width:0;}
.cn2{font-size:13px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cs{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.ca{display:flex;gap:5px;flex-shrink:0;}
.ab{border:none;border-radius:5px;padding:4px 8px;cursor:pointer;font-size:10px;font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
.ao{background:rgba(16,185,129,.14);color:var(--g);border:1px solid rgba(16,185,129,.28);}
.ao:hover{background:rgba(16,185,129,.3);}
.af{background:var(--s3);color:var(--t3);border:1px solid var(--bd);}
.af:hover{color:var(--r);}
.dbx{background:rgba(245,158,11,.1);color:var(--o);border:1px solid rgba(245,158,11,.2);border-radius:5px;padding:3px 7px;font-size:10px;}
.ir{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px;}
.it{display:inline-flex;align-items:center;gap:4px;background:var(--s2);border-radius:5px;padding:4px 8px;font-size:11px;}
.il{color:var(--t3);font-size:10px;}.iv{color:var(--t2);}
.iv.em{color:var(--p2);}.iv.gv{color:var(--g);font-family:'IBM Plex Mono',monospace;font-size:10px;}
.iv.ev{color:var(--p2);font-family:'IBM Plex Mono',monospace;font-size:10px;}
.ef{display:flex;align-items:center;gap:6px;background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);border-radius:5px;padding:5px 10px;margin:0 12px 8px;font-size:11px;}
.el{color:var(--t3);font-size:10px;flex-shrink:0;}.ev2{color:var(--g);font-family:'IBM Plex Mono',monospace;font-size:11px;}
.tg{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px;}
.tgi{padding:2px 6px;border-radius:4px;font-size:10px;border:1px solid var(--bd);color:var(--t3);}
.tg-p{color:var(--p2);border-color:rgba(99,102,241,.3);background:rgba(99,102,241,.07);}
.tg-g{color:var(--g);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.07);}
.tg-o{color:var(--o);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.07);}
.sm{border-top:1px solid var(--bd);padding:8px 12px 10px;background:rgba(59,130,246,.03);}
.sm-h{display:flex;align-items:center;gap:5px;margin-bottom:5px;}
.sm-l{font-size:9px;color:var(--b);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.5px;}
.sm-b{font-size:8px;padding:1px 4px;border-radius:3px;background:rgba(59,130,246,.1);color:var(--b);border:1px solid rgba(59,130,246,.2);}
.sm-t{font-size:11px;color:var(--t2);line-height:1.8;}
.hl{color:var(--o);}.kr{color:var(--p2);}
.err{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-radius:7px;padding:12px;color:#fca5a5;font-size:12px;margin:12px;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">KOMICS <em>DB</em> Updater<sup>v4</sup></div>
    <div class="hd">뉴스레터 URL 또는 텍스트 → 바이어 추출 + 웹검색 최신정보</div>
  </div>
</header>

<div class="wrap">
  <div class="panel left">
    <div class="ph"><div class="dot"></div>입력</div>
    <div class="sc">

      <!-- 탭 -->
      <div class="tabs">
        <button class="tab on" id="tab-url" onclick="switchTab('url')">🔗 URL 입력</button>
        <button class="tab" id="tab-text" onclick="switchTab('text')">📋 텍스트 붙여넣기</button>
      </div>

      <!-- URL 입력 영역 -->
      <div id="area-url">
        <div class="url-wrap">
          <input class="url-inp" id="urlInp" placeholder="https://animationmagazine.net/..." type="url">
          <button class="url-btn" onclick="fetchUrl()">가져오기</button>
        </div>
        <div id="fetchedInfo" style="display:none"></div>
        <div style="font-size:11px;color:var(--t3);line-height:1.8;margin-top:4px;">
          Animation Magazine · Kidscreen · C21 Media<br>
          보도자료 등 기사 URL을 그대로 붙여넣으세요
        </div>
      </div>

      <!-- 텍스트 입력 영역 -->
      <div id="area-text" style="display:none">
        <textarea id="textInp" placeholder="뉴스레터 텍스트를 여기에 붙여넣으세요.

Animation Magazine, Kidscreen Daily,
C21 Media, MIPCOM/MIFA 업데이트 등
영어·한국어 모두 지원됩니다." rows="10"></textarea>
        <div class="ch2" id="cc">0자</div>
      </div>

      <label class="ck"><input type="checkbox" id="cs" checked>🔍 웹검색으로 최신정보 보완</label>
      <label class="ck"><input type="checkbox" id="ck2" checked>🇰🇷 한국 콘텐츠 관련성 분석</label>
      <label class="ck"><input type="checkbox" id="cpr" checked>⭐ 우선순위 판별 (S/A/B/C)</label>

      <button class="rb" id="rb" onclick="run()">⚡ 바이어 정보 추출</button>
    </div>
  </div>

  <div class="panel right">
    <div class="rh">
      <div class="rht">추출 결과</div>
      <span class="cba cn" id="cnn" style="display:none">신규 0건</span>
      <span class="cba cdd" id="cdd" style="display:none">중복 0건</span>
      <div class="rt" id="rt" style="display:none">
        <button class="tb" onclick="sa()">전체 선택</button>
        <button class="tb pr" onclick="ex()" id="eb">✓ 선택 0건 CSV</button>
      </div>
    </div>
    <div class="res" id="res">
      <div class="es">
        <div class="ei">📬</div>
        <div class="et">URL 또는 텍스트로 분석 시작</div>
        <div class="ed">뉴스레터 URL을 붙여넣거나<br>텍스트를 직접 입력하세요<br><br>바이어 정보를 자동 추출하고<br>웹검색으로 최신정보를 반영합니다</div>
      </div>
    </div>
  </div>
</div>

<script>
let items=[], sel=new Set(), fetchedContent='', currentTab='url';

function switchTab(t){
  currentTab=t;
  document.getElementById('tab-url').classList.toggle('on',t==='url');
  document.getElementById('tab-text').classList.toggle('on',t==='text');
  document.getElementById('area-url').style.display=t==='url'?'flex':'none';
  document.getElementById('area-url').style.flexDirection='column';
  document.getElementById('area-url').style.gap='8px';
  document.getElementById('area-text').style.display=t==='text'?'block':'none';
}
switchTab('url');

document.getElementById('textInp').addEventListener('input',function(){
  document.getElementById('cc').textContent=this.value.length.toLocaleString()+'자';
});

async function callServer(body){
  const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||`HTTP ${r.status}`);
  return d;
}

async function fetchUrl(){
  const url=document.getElementById('urlInp').value.trim();
  if(!url){alert('URL을 입력해주세요.');return;}
  const btn=document.querySelector('.url-btn');
  btn.textContent='⏳ 가져오는 중...';btn.disabled=true;
  try{
    const d=await callServer({type:'url',url,prompt:'이 페이지의 텍스트 내용을 그대로 반환해주세요.'});
    fetchedContent=d.fetchedContent||'';
    document.getElementById('fetchedInfo').style.display='flex';
    document.getElementById('fetchedInfo').innerHTML=`<div class="fetched-box">✅ 페이지 가져오기 완료 <span class="fetched-url">${url}</span></div>`;
  }catch(e){
    document.getElementById('fetchedInfo').style.display='flex';
    document.getElementById('fetchedInfo').innerHTML=`<div class="err" style="margin:0">❌ ${e.message}</div>`;
  }
  btn.textContent='가져오기';btn.disabled=false;
}

function ld(t,s=''){document.getElementById('res').innerHTML=`<div class="ld"><div class="sp"></div><div class="lt">${t}</div>${s?`<div class="ls">${s}</div>`:''}</div>`;}
function er(m){document.getElementById('res').innerHTML=`<div class="err">❌ ${m}<br><small style="opacity:.7;margin-top:4px;display:block">다시 시도해주세요.</small></div>`;}

async function run(){
  let content='';
  if(currentTab==='url'){
    content=fetchedContent;
    if(!content){
      const url=document.getElementById('urlInp').value.trim();
      if(!url){alert('URL을 먼저 입력하고 "가져오기"를 눌러주세요.');return;}
      await fetchUrl();
      content=fetchedContent;
      if(!content){er('URL 내용을 가져오지 못했습니다.');return;}
    }
  } else {
    content=document.getElementById('textInp').value.trim();
    if(!content){alert('뉴스레터 내용을 입력해주세요.');return;}
  }

  const doS=document.getElementById('cs').checked;
  const doK=document.getElementById('ck2').checked;
  const doPr=document.getElementById('cpr').checked;
  const btn=document.getElementById('rb');
  btn.disabled=true;btn.textContent='⏳ 분석 중...';
  ld('Step 1/3 — 바이어 정보 추출 중...');

  const p1=`만화·웹툰·애니메이션 산업 전문 분석가입니다. 아래 내용에서 바이어·담당자 정보를 추출하여 JSON만 반환하세요 (마크다운 금지):
{"buyers":[{"name":"담당자 이름(없으면 null)","company":"기업명","title":"직함(없으면 null)","email":"이메일(명시된 경우만, 없으면 null — 절대 추론 금지)","website":"웹사이트(있으면, 없으면 null)","country":"국가","buyerType":"만화 출판사|웹툰 플랫폼|OTT/스트리밍|방송사|애니메이션 스튜디오|영화·드라마 제작사|IP 에이전시 중 하나","contentFocus":"콘텐츠 관심분야","dealTypeWebtoon":"관련 딜 유형(없으면 null)","genreInterest":"관심 장르(없으면 null)","interestKContent":"${doK?'Y 또는 N':'N'}","kContentNote":"한국 콘텐츠 근거(없으면 null)","priorityTier":"${doPr?'S(한국 실거래)|A(관심 확인)|B(일반)|C(기타)':'C'}","languageMarket":"영어권(북미)|영어권(영국/유럽)|불어권|독어권(DACH)|일본어권|글로벌(전 언어권) 중 하나","eventMatch":"USA|France|Germany 중 해당(/ 구분)","source":"출처","isDuplicate":false}]}
이메일은 명시된 경우에만, 없으면 반드시 null.
내용:
${content.slice(0,6000)}`;

  let buyers=[];
  try{
    const r=await callServer({type:'text',prompt:p1});
    buyers=JSON.parse(r.result.replace(/```json|```/g,'').trim()).buyers||[];
  }catch(e){er('Step 1 오류: '+e.message);btn.disabled=false;btn.textContent='⚡ 바이어 정보 추출';return;}

  if(doS&&buyers.length>0){
    for(let i=0;i<buyers.length;i++){
      const b=buyers[i];if(!b.name&&!b.company)continue;
      ld(`Step 2/3 — ${i+1}/${buyers.length}명 웹검색 중`,`🔍 ${b.name||b.company}`);
      try{
        const p2=`다음 인물/기업을 웹 검색하여 최신 정보를 찾고 JSON만 반환하세요 (마크다운 금지):
인물: ${b.name||'없음'} / 기업: ${b.company||'없음'} / 직함: ${b.title||'없음'}
{"recentNews":"최근 뉴스·동향 1~2문장(없으면 null)","jobChange":"최근 이직·승진(없으면 null)","companyUpdate":"회사 최근 사업 변화(없으면 null)","kContentLink":"한국 콘텐츠 협업·거래 이력(없으면 null)","email":"공식 이메일(찾은 경우만, 없으면 null)","photoUrl":"공식 프로필 사진 URL(공식홈·보도자료에서 찾은 경우만, 없으면 null)"}`;
        const r2=await callServer({type:'text',prompt:p2,useSearch:true});
        const info=JSON.parse(r2.result.replace(/```json|```/g,'').trim());
        buyers[i]._si=info;
        if(!buyers[i].email&&info.email)buyers[i].email=info.email;
        if(info.photoUrl)buyers[i]._ph=info.photoUrl;
      }catch(e){buyers[i]._si=null;}
    }
  }

  ld('Step 3/3 — 결과 정리 중...');
  await new Promise(r=>setTimeout(r,200));
  items=buyers.map((b,i)=>({...b,_id:i}));
  sel=new Set(items.filter(b=>!b.isDuplicate).map(b=>b._id));
  rend();btn.disabled=false;btn.textContent='⚡ 바이어 정보 추출';
}

function rend(){
  const ni=items.filter(b=>!b.isDuplicate),di=items.filter(b=>b.isDuplicate);
  document.getElementById('cnn').textContent=`신규 ${ni.length}건`;
  document.getElementById('cdd').textContent=`중복 ${di.length}건`;
  document.getElementById('cnn').style.display=ni.length?'inline':'none';
  document.getElementById('cdd').style.display=di.length?'inline':'none';
  document.getElementById('rt').style.display=items.length?'flex':'none';
  if(!items.length){document.getElementById('res').innerHTML=`<div class="es"><div class="ei">🔍</div><div class="et">추출된 바이어가 없습니다</div></div>`;return;}
  const ic={'만화 출판사':'📚','웹툰 플랫폼':'📱','OTT/스트리밍':'📺','방송사':'📡','애니메이션 스튜디오':'🎬','영화·드라마 제작사':'🎥','IP 에이전시':'🏷️'};
  const pc={S:'pS',A:'pA',B:'pB',C:'pC'};
  const pl={S:'S급 최우선',A:'A급 우선',B:'B급',C:'C급'};
  const html=items.map(b=>{
    const icon=ic[b.buyerType]||'🏢',si=b._si;
    const av=b._ph?`<div class="av"><img src="${b._ph}" onerror="this.parentElement.innerHTML='${icon}'" alt=""><div class="sb">🔍</div></div>`:`<div class="av">${icon}</div>`;
    const infoData=[['기업',b.company,'em'],['직함',b.title,''],['국가',b.country,''],['행사',b.eventMatch,'ev'],['바이어유형',b.buyerType,''],['딜유형',b.dealTypeWebtoon,''],['장르',b.genreInterest,'']].filter(([,v])=>v);
    const infoHtml=infoData.map(([l,v,c])=>`<div class="it"><span class="il">${l}</span><span class="iv ${c}">${v}</span></div>`).join('');
    const emHtml=b.email?`<div class="ef"><span class="el">✉ 이메일</span><span class="ev2">${b.email}</span></div>`:'';
    const tags=[];
    if(b.interestKContent==='Y')tags.push(['tg-g','🇰🇷 K-콘텐츠 관심']);
    if(b.priorityTier&&b.priorityTier!=='C')tags.push([b.priorityTier==='S'?'tg-g':b.priorityTier==='A'?'tg-p':'',pl[b.priorityTier]]);
    if(si?.jobChange)tags.push(['tg-o','⚡ 최근 이직']);
    const tgHtml=tags.length?`<div class="tg">${tags.map(([c,t])=>`<span class="tgi ${c}">${t}</span>`).join('')}</div>`:'';
    const ml=[];
    if(si?.jobChange)ml.push(`<span class="hl">⚡ ${si.jobChange}</span>`);
    if(si?.companyUpdate)ml.push(si.companyUpdate);
    if(si?.recentNews)ml.push(si.recentNews);
    if(si?.kContentLink)ml.push(`<span class="kr">🇰🇷 ${si.kContentLink}</span>`);
    const memoHtml=ml.length?`<div class="sm"><div class="sm-h"><span class="sm-l">🔍 웹검색 최신정보</span><span class="sm-b">AI 검색</span></div><div class="sm-t">${ml.join('<br>')}</div></div>`:'';
    const acts=b.isDuplicate?`<span class="dbx">⚠ 중복확인</span>`:`<button class="ab ${sel.has(b._id)?'ao':'af'}" onclick="ts(${b._id})">${sel.has(b._id)?'✓ 선택':'+ 추가'}</button>`;
    return `<div class="card ${b.isDuplicate?'dc':'nc'}" id="c${b._id}">
      <div class="ps ${pc[b.priorityTier]||'pC'}"></div>
      <div class="ct">${av}<div class="ci"><div class="cn2">${b.name||'(담당자 미상)'} <span style="font-size:10px;color:var(--t3);font-weight:400">@ ${b.company||'-'}</span></div><div class="cs">${[b.title,b.source].filter(Boolean).join(' · ')}</div></div><div class="ca">${acts}</div></div>
      ${infoHtml?`<div class="ir">${infoHtml}</div>`:''}
      ${emHtml}${tgHtml}${memoHtml}
    </div>`;
  }).join('');
  document.getElementById('res').innerHTML=`<div class="cards">${html}</div>`;
  ue();
}

function ts(id){
  if(sel.has(id))sel.delete(id);else sel.add(id);
  const c=document.getElementById('c'+id),b=c?.querySelector('.ab');
  if(b){if(sel.has(id)){b.className='ab ao';b.textContent='✓ 선택';}else{b.className='ab af';b.textContent='+ 추가';}}
  ue();
}
function sa(){items.filter(b=>!b.isDuplicate).forEach(b=>sel.add(b._id));rend();}
function ue(){const b=document.getElementById('eb');if(b)b.textContent=`✓ 선택 ${sel.size}건 CSV`;}

function ex(){
  const list=items.filter(b=>sel.has(b._id));
  if(!list.length){alert('선택된 항목이 없습니다.');return;}
  const hd=['id','inviteStatus','priorityTier','eventMatch','name','title','company','email','phone','website','country','languageMarket','regionCoverage','buyerType','targetSegment','contentFocus','preferredFormat','interestKContent','dealTypeWebtoon','genreInterest','meetingPurposeFit','supportedDealTypes','kContentNote','collaborationHistory','verificationTier','source','active','notes'];
  const now=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const rows=list.map((b,i)=>{
    const si=b._si,np=['⚠️ 뉴스레터 자동 추출 — 발송 전 확인 필요'];
    if(si?.jobChange)np.push('⚡ '+si.jobChange);
    if(si?.companyUpdate)np.push(si.companyUpdate);
    if(si?.recentNews)np.push(si.recentNews);
    if(si?.kContentLink)np.push('🇰🇷 '+si.kContentLink);
    return{id:`NL-${now}-${String(i+1).padStart(3,'0')}`,inviteStatus:'미접촉',priorityTier:b.priorityTier||'C',eventMatch:b.eventMatch||'USA',name:b.name||'',title:b.title||'',company:b.company||'',email:b.email||'',phone:'',website:b.website||'',country:b.country||'',languageMarket:b.languageMarket||'',regionCoverage:'',buyerType:b.buyerType||'',targetSegment:'',contentFocus:b.contentFocus||'',preferredFormat:'',interestKContent:b.interestKContent||'N',dealTypeWebtoon:b.dealTypeWebtoon||'',genreInterest:b.genreInterest||'',meetingPurposeFit:'',supportedDealTypes:'',kContentNote:b.kContentNote||(si?.kContentLink||''),collaborationHistory:'',verificationTier:'C',source:b.source||'뉴스레터 추출',active:'true',notes:np.join(' / ')};
  });
  const csv='\uFEFF'+[hd.join(','),...rows.map(r=>hd.map(h=>`"${String(r[h]||'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),download:`komics_db_${new Date().toISOString().slice(0,10)}.csv`});
  a.click();
}
</script>
</body>
</html>
