<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOMICS DB Updater</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
:root{
  --bg:#07080f;--s1:#0f1018;--s2:#161720;--s3:#1e1f2e;
  --bd:#252638;--bd2:#2e2f45;
  --p:#6366f1;--p2:#818cf8;--g:#10b981;--o:#f59e0b;--r:#ef4444;--b:#3b82f6;
  --t:#f1f1f6;--t2:#9ca3c4;--t3:#5c5e7a;--rr:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t);font-size:13px;line-height:1.5;}
header{background:var(--s1);border-bottom:1px solid var(--bd);padding:11px 20px;display:flex;align-items:center;gap:10px;}
.logo{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--p2);}
.logo em{color:var(--o);font-style:normal;}
.logo sup{font-size:9px;color:var(--g);vertical-align:super;}
.hd{font-size:11px;color:var(--t3);margin-top:1px;}
.wrap{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 51px);}
.panel{display:flex;flex-direction:column;overflow:hidden;}
.ph{padding:10px 16px;border-bottom:1px solid var(--bd);font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);display:flex;align-items:center;gap:6px;background:var(--s1);}
.dot{width:5px;height:5px;border-radius:50%;background:var(--g);}
.left{background:var(--s1);border-right:1px solid var(--bd);}
.sc{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.tabs{display:flex;gap:0;border:1px solid var(--bd);border-radius:7px;overflow:hidden;}
.tab{flex:1;padding:8px;text-align:center;cursor:pointer;font-size:11px;color:var(--t3);background:var(--s2);transition:all .2s;border:none;font-family:'Noto Sans KR',sans-serif;}
.tab.on{background:var(--p);color:#fff;}

/* URL 리스트 */
.url-list{display:flex;flex-direction:column;gap:6px;}
.url-row{display:flex;gap:6px;align-items:center;}
.url-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--t3);width:16px;flex-shrink:0;text-align:right;}
.url-inp{flex:1;background:var(--s2);border:1px solid var(--bd2);border-radius:6px;color:var(--t);font-size:11px;padding:8px 10px;outline:none;transition:border-color .2s;font-family:'IBM Plex Mono',monospace;}
.url-inp:focus{border-color:var(--p);}
.url-inp::placeholder{color:var(--t3);font-family:'Noto Sans KR',sans-serif;}
.url-del{background:none;border:none;cursor:pointer;color:var(--t3);font-size:14px;padding:2px 4px;transition:color .2s;}
.url-del:hover{color:var(--r);}
.url-add{background:var(--s2);border:1px solid var(--bd2);border-radius:6px;color:var(--t2);padding:7px;cursor:pointer;font-size:11px;transition:all .2s;width:100%;font-family:'Noto Sans KR',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;}
.url-add:hover{border-color:var(--p);color:var(--t);}
.fetch-btn{background:var(--p);color:#fff;border:none;border-radius:6px;padding:9px;cursor:pointer;font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:600;transition:all .2s;width:100%;}
.fetch-btn:hover:not(:disabled){background:#4f52d9;}
.fetch-btn:disabled{opacity:.4;cursor:not-allowed;}

/* 가져온 URL 미리보기 */
.fetched-list{display:flex;flex-direction:column;gap:5px;}
.fetched-item{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;display:flex;align-items:flex-start;gap:8px;}
.fetched-item.ok{border-color:rgba(16,185,129,.3);}
.fetched-item.fail{border-color:rgba(239,68,68,.3);}
.fi-icon{font-size:13px;flex-shrink:0;margin-top:1px;}
.fi-body{flex:1;min-width:0;}
.fi-url{font-size:10px;color:var(--t3);font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.fi-preview{font-size:11px;color:var(--t2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.fi-imgs{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.fi-img{width:44px;height:44px;border-radius:4px;object-fit:cover;border:1px solid var(--bd);cursor:pointer;}

textarea{background:var(--s2);border:1px solid var(--bd2);border-radius:var(--rr);color:var(--t);font-family:'Noto Sans KR',sans-serif;font-size:12px;padding:11px;resize:none;outline:none;line-height:1.8;transition:border-color .2s;min-height:200px;width:100%;}
textarea:focus{border-color:var(--p);}
textarea::placeholder{color:var(--t3);}
.ch2{font-size:10px;color:var(--t3);text-align:right;}
label.ck{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--t2);cursor:pointer;}
label.ck input{accent-color:var(--p);width:12px;height:12px;}
.rb{background:var(--p);color:#fff;border:none;border-radius:7px;padding:11px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;}
.rb:hover:not(:disabled){background:#4f52d9;transform:translateY(-1px);}
.rb:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* Right */
.right{background:var(--bg);display:flex;flex-direction:column;}
.rh{padding:9px 16px;border-bottom:1px solid var(--bd);background:var(--s1);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.rht{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;}
.cba{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:10px;}
.cn{background:rgba(16,185,129,.13);color:var(--g);border:1px solid rgba(16,185,129,.28);}
.cdd{background:rgba(245,158,11,.13);color:var(--o);border:1px solid rgba(245,158,11,.28);}
.rt{margin-left:auto;display:flex;gap:6px;}
.tb{background:var(--s2);border:1px solid var(--bd2);color:var(--t2);padding:5px 10px;border-radius:5px;cursor:pointer;font-size:11px;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.tb:hover{border-color:var(--p);color:var(--t);}
.tb.pr{background:var(--g);color:#fff;border-color:var(--g);}
.tb.pr:hover{background:#0ea572;}
.res{flex:1;overflow-y:auto;padding:12px;}
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--t3);}
.ei{font-size:38px;opacity:.2;}.et{font-size:12px;color:var(--t2);}
.ed{font-size:11px;text-align:center;max-width:240px;line-height:1.9;}
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;}
.sp{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.lt{font-size:12px;color:var(--t2);text-align:center;max-width:260px;}
.ls{font-size:11px;color:var(--t3);}
.cards{display:flex;flex-direction:column;gap:8px;}

/* Source badge */
.src-badge{font-size:9px;padding:1px 5px;border-radius:3px;background:rgba(59,130,246,.1);color:var(--b);border:1px solid rgba(59,130,246,.2);font-family:'IBM Plex Mono',monospace;flex-shrink:0;}

/* 뉴스레터 이미지 */
.nl-imgs{display:flex;gap:5px;padding:0 12px 8px;flex-wrap:wrap;}
.nl-img{height:52px;border-radius:5px;object-fit:cover;border:1px solid var(--bd);cursor:pointer;transition:border-color .2s;}
.nl-img:hover{border-color:var(--p);}

.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rr);overflow:hidden;transition:border-color .2s;}
.card:hover{border-color:var(--bd2);}
.card.nc{border-left:3px solid var(--g);}
.card.dc{border-left:3px solid var(--o);opacity:.7;}
.ps{height:2px;width:100%;}
.pS{background:var(--r);}.pA{background:var(--p);}.pB{background:var(--b);}.pC{background:var(--bd);}
.ct{display:flex;align-items:center;gap:10px;padding:11px 12px 8px;}
.av{width:40px;height:40px;border-radius:8px;overflow:hidden;background:rgba(99,102,241,.18);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;position:relative;}
.av img{width:100%;height:100%;object-fit:cover;}
.sb{position:absolute;bottom:-2px;right:-2px;width:13px;height:13px;border-radius:50%;background:var(--g);border:2px solid var(--s1);font-size:7px;display:flex;align-items:center;justify-content:center;}
.ci{flex:1;min-width:0;}
.cn2{font-size:13px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cs{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.ca{display:flex;gap:5px;flex-shrink:0;}
.ab{border:none;border-radius:5px;padding:4px 8px;cursor:pointer;font-size:10px;font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
.ao{background:rgba(16,185,129,.14);color:var(--g);border:1px solid rgba(16,185,129,.28);}
.ao:hover{background:rgba(16,185,129,.3);}
.af{background:var(--s3);color:var(--t3);border:1px solid var(--bd);}
.af:hover{color:var(--r);}
.dbx{background:rgba(245,158,11,.1);color:var(--o);border:1px solid rgba(245,158,11,.2);border-radius:5px;padding:3px 7px;font-size:10px;}
.ir{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px;}
.it{display:inline-flex;align-items:center;gap:4px;background:var(--s2);border-radius:5px;padding:4px 8px;font-size:11px;}
.il{color:var(--t3);font-size:10px;}.iv{color:var(--t2);}
.iv.em{color:var(--p2);}.iv.gv{color:var(--g);font-family:'IBM Plex Mono',monospace;font-size:10px;}
.iv.ev{color:var(--p2);font-family:'IBM Plex Mono',monospace;font-size:10px;}
.ef{display:flex;align-items:center;gap:6px;background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);border-radius:5px;padding:5px 10px;margin:0 12px 8px;font-size:11px;}
.el{color:var(--t3);font-size:10px;flex-shrink:0;}.ev2{color:var(--g);font-family:'IBM Plex Mono',monospace;font-size:11px;}
.tg{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px;}
.tgi{padding:2px 6px;border-radius:4px;font-size:10px;border:1px solid var(--bd);color:var(--t3);}
.tg-p{color:var(--p2);border-color:rgba(99,102,241,.3);background:rgba(99,102,241,.07);}
.tg-g{color:var(--g);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.07);}
.tg-o{color:var(--o);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.07);}
.sm{border-top:1px solid var(--bd);padding:8px 12px 10px;background:rgba(59,130,246,.03);}
.sm-h{display:flex;align-items:center;gap:5px;margin-bottom:5px;}
.sm-l{font-size:9px;color:var(--b);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.5px;}
.sm-b{font-size:8px;padding:1px 4px;border-radius:3px;background:rgba(59,130,246,.1);color:var(--b);border:1px solid rgba(59,130,246,.2);}
.sm-t{font-size:11px;color:var(--t2);line-height:1.8;}
.hl{color:var(--o);}.kr{color:var(--p2);}
/* 교차검증 섹션 */
.vd{border-top:1px solid var(--bd);padding:8px 12px 10px;}
.vd-h{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.vd-title{font-size:9px;color:var(--g);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.5px;}
.vd-sources{display:flex;flex-direction:column;gap:4px;}
.vd-src{background:var(--s2);border-radius:6px;padding:6px 9px;}
.vd-src-h{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.vd-src-label{font-size:10px;color:var(--t2);font-weight:500;}
.vd-src-badge{font-size:9px;padding:1px 5px;border-radius:3px;}
.vs-ok{background:rgba(16,185,129,.12);color:var(--g);border:1px solid rgba(16,185,129,.25);}
.vs-fail{background:rgba(239,68,68,.1);color:var(--r);border:1px solid rgba(239,68,68,.2);}
.vd-src-body{font-size:11px;color:var(--t2);line-height:1.7;}
.vd-conflict{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);border-radius:5px;padding:5px 9px;font-size:11px;color:var(--o);margin-top:5px;}
.vd-urls{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.vd-url{font-size:9px;color:var(--b);font-family:'IBM Plex Mono',monospace;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);padding:1px 5px;border-radius:3px;text-decoration:none;white-space:nowrap;overflow:hidden;max-width:180px;text-overflow:ellipsis;display:block;}
.err{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-radius:7px;padding:12px;color:#fca5a5;font-size:12px;margin:12px;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">KOMICS <em>DB</em> Updater<sup>v5</sup></div>
    <div class="hd">뉴스레터 URL(복수) 또는 텍스트 → 바이어 추출 + 웹검색 최신정보</div>
  </div>
</header>

<div class="wrap">
  <div class="panel left">
    <div class="ph"><div class="dot"></div>입력</div>
    <div class="sc">
      <div class="tabs">
        <button class="tab on" id="tab-url" onclick="switchTab('url')">🔗 URL 입력</button>
        <button class="tab" id="tab-text" onclick="switchTab('text')">📋 텍스트 붙여넣기</button>
      </div>

      <!-- URL 영역 -->
      <div id="area-url" style="display:flex;flex-direction:column;gap:8px;">
        <div class="url-list" id="urlList"></div>
        <button class="url-add" onclick="addUrl()">＋ URL 추가</button>
        <button class="fetch-btn" id="fetchBtn" onclick="fetchAll()">📥 페이지 가져오기</button>
        <div id="fetchedList" class="fetched-list"></div>
      </div>

      <!-- 텍스트 영역 -->
      <div id="area-text" style="display:none;">
        <textarea id="textInp" placeholder="뉴스레터 텍스트를 붙여넣으세요." rows="10"></textarea>
        <div class="ch2" id="cc">0자</div>
      </div>

      <label class="ck"><input type="checkbox" id="cs" checked>🔍 웹검색으로 최신정보 보완</label>
      <label class="ck"><input type="checkbox" id="ck2" checked>🇰🇷 한국 콘텐츠 관련성 분석</label>
      <label class="ck"><input type="checkbox" id="cpr" checked>⭐ 우선순위 판별 (S/A/B/C)</label>
      <button class="rb" id="rb" onclick="run()">⚡ 바이어 정보 추출</button>
    </div>
  </div>

  <div class="panel right">
    <div class="rh">
      <div class="rht">추출 결과</div>
      <span class="cba cn" id="cnn" style="display:none">신규 0건</span>
      <span class="cba cdd" id="cdd" style="display:none">중복 0건</span>
      <div class="rt" id="rt" style="display:none">
        <button class="tb" onclick="sa()">전체 선택</button>
        <button class="tb pr" onclick="ex()" id="eb">✓ 선택 0건 CSV</button>
      </div>
    </div>
    <div class="res" id="res">
      <div class="es">
        <div class="ei">📬</div>
        <div class="et">URL 여러 개 또는 텍스트로 분석 시작</div>
        <div class="ed">URL을 여러 개 추가하거나<br>텍스트를 직접 입력하세요<br><br>바이어 정보 자동 추출 +<br>웹검색으로 최신정보 반영</div>
      </div>
    </div>
  </div>
</div>

<script>
let items=[], sel=new Set(), fetchedPages=[], currentTab="url";

function parseJSON(text) {
  if (!text) return {};
  text = text.replace(/```json|```/g, "").trim();
  const match = text.match(/{[\s\S]*}/);
  if (!match) throw new Error("JSON 없음: " + text.slice(0,100));
  return JSON.parse(match[0]);
}

// ── 탭 전환 ──────────────────────────────────────────
function switchTab(t){
  currentTab=t;
  document.getElementById('tab-url').classList.toggle('on',t==='url');
  document.getElementById('tab-text').classList.toggle('on',t==='text');
  document.getElementById('area-url').style.display=t==='url'?'flex':'none';
  document.getElementById('area-text').style.display=t==='text'?'block':'none';
}

// ── URL 관리 ─────────────────────────────────────────
let urlCount=0;
function addUrl(){
  urlCount++;
  const list=document.getElementById('urlList');
  const row=document.createElement('div');
  row.className='url-row';
  row.id='urlrow-'+urlCount;
  row.innerHTML=`<span class="url-num">${list.children.length+1}</span>
    <input class="url-inp" placeholder="https://animationmagazine.net/..." type="url" id="url-${urlCount}">
    <button class="url-del" onclick="delUrl('urlrow-${urlCount}')">✕</button>`;
  list.appendChild(row);
  document.getElementById('url-'+urlCount).focus();
}
function delUrl(id){
  document.getElementById(id)?.remove();
  // 번호 재정렬
  document.querySelectorAll('.url-row').forEach((r,i)=>{
    const num=r.querySelector('.url-num');
    if(num) num.textContent=i+1;
  });
}
function getUrls(){
  return [...document.querySelectorAll('.url-inp')].map(i=>i.value.trim()).filter(Boolean);
}

// 초기 URL 입력창 1개
addUrl();

document.getElementById('textInp').addEventListener('input',function(){
  document.getElementById('cc').textContent=this.value.length.toLocaleString()+'자';
});

// ── 서버 호출 ─────────────────────────────────────────
async function callServer(body, timeoutMs=25000){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const r=await fetch('/api/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),
      signal:ctrl.signal
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||`HTTP ${r.status}`);
    return d;
  }finally{
    clearTimeout(timer);
  }
}

// ── URL 페이지 가져오기 ───────────────────────────────
async function fetchAll(){
  const urls=getUrls();
  if(!urls.length){alert('URL을 입력해주세요.');return;}
  const btn=document.getElementById('fetchBtn');
  btn.disabled=true;btn.textContent='⏳ 가져오는 중...';
  document.getElementById('fetchedList').innerHTML='';
  try{
    const d=await callServer({type:'urls',urls}, 30000);
    fetchedPages=d.pages||[];
    renderFetched();
  }catch(e){
    document.getElementById('fetchedList').innerHTML=`<div class="err" style="margin:0">❌ ${e.message}</div>`;
  }
  btn.disabled=false;btn.textContent='📥 페이지 가져오기';
}

function renderFetched(){
  const el=document.getElementById('fetchedList');
  el.innerHTML=fetchedPages.map(p=>{
    if(!p.ok) return `<div class="fetched-item fail"><span class="fi-icon">❌</span><div class="fi-body"><div class="fi-url">${p.url}</div><div class="fi-preview" style="color:var(--r)">${p.error}</div></div></div>`;
    const preview=p.text?.slice(0,120)||'';
    const imgs=p.images?.slice(0,6).map(img=>`<img class="fi-img" src="${img.url||img}" onerror="this.style.display='none'" alt="${img.caption||''}" title="${img.caption||''}">`).join('')||'';
    return `<div class="fetched-item ok">
      <span class="fi-icon">✅</span>
      <div class="fi-body">
        <div class="fi-url">${p.url}</div>
        <div class="fi-preview">${preview}...</div>
        ${imgs?`<div class="fi-imgs">${imgs}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ── 로딩/에러 ─────────────────────────────────────────
function ld(t,s=''){document.getElementById('res').innerHTML=`<div class="ld"><div class="sp"></div><div class="lt">${t}</div>${s?`<div class="ls">${s}</div>`:''}</div>`;}
function er(m){document.getElementById('res').innerHTML=`<div class="err">❌ ${m}<br><small style="opacity:.7;margin-top:4px;display:block">다시 시도해주세요.</small></div>`;}

// ── 메인 추출 ─────────────────────────────────────────
async function run(){
  const doS=document.getElementById('cs').checked;
  const doK=document.getElementById('ck2').checked;
  const doPr=document.getElementById('cpr').checked;
  const btn=document.getElementById('rb');
  btn.disabled=true;btn.textContent='⏳ 분석 중...';

  // 분석할 텍스트 수집
  let allContent=[];
  let allImages=[];

  if(currentTab==='url'){
    if(!fetchedPages.length){
      const urls=getUrls();
      if(!urls.length){alert('URL을 입력하고 "페이지 가져오기"를 먼저 눌러주세요.');btn.disabled=false;btn.textContent='⚡ 바이어 정보 추출';return;}
      await fetchAll();
    }
    fetchedPages.filter(p=>p.ok).forEach(p=>{
      if(p.text) allContent.push(`[출처: ${p.url}]\n${p.text}`);
      if(p.images) allImages.push(...p.images); // images = [{url, caption}]
    });
  } else {
    const t=document.getElementById('textInp').value.trim();
    if(!t){alert('뉴스레터 내용을 입력해주세요.');btn.disabled=false;btn.textContent='⚡ 바이어 정보 추출';return;}
    allContent.push(t);
  }

  if(!allContent.length){er('분석할 내용이 없습니다.');btn.disabled=false;btn.textContent='⚡ 바이어 정보 추출';return;}

  ld(`Step 1/${fetchedPages.filter(p=>p.ok).length||1} — 바이어 정보 추출 중...`);

  const combinedText=allContent.join('\n\n---\n\n').slice(0,12000);
  const p1=`만화·웹툰·애니메이션 산업 전문 분석가입니다. 아래 내용 전체에서 바이어·담당자 정보를 빠짐없이 모두 추출하여 JSON만 반환하세요 (마크다운 금지):
{"buyers":[{"name":"담당자 이름(없으면 null)","company":"기업명","title":"직함(없으면 null)","email":"이메일(명시된 경우만, 없으면 null — 절대 추론 금지)","website":"웹사이트(있으면)","country":"국가","buyerType":"만화 출판사|웹툰 플랫폼|OTT/스트리밍|방송사|애니메이션 스튜디오|영화·드라마 제작사|IP 에이전시 중 하나","contentFocus":"콘텐츠 관심분야","dealTypeWebtoon":"관련 딜 유형(없으면 null)","genreInterest":"관심 장르(없으면 null)","interestKContent":"${doK?'Y 또는 N':'N'}","kContentNote":"한국 콘텐츠 근거(없으면 null)","priorityTier":"${doPr?'S(한국 실거래)|A(관심 확인)|B(일반)|C(기타)':'C'}","languageMarket":"영어권(북미)|영어권(영국/유럽)|불어권|독어권(DACH)|일본어권|글로벌(전 언어권) 중 하나","eventMatch":"USA|France|Germany 중 해당(/ 구분)","source":"출처 URL 또는 뉴스레터명","isDuplicate":false}]}
중요: 여러 URL에서 같은 인물이 나오면 isDuplicate:true 표시. 이메일은 명시된 경우에만.
내용:
${combinedText}`;

  let buyers=[];
  try{
    const r=await callServer({type:'text',prompt:p1}, 55000);
    buyers=parseJSON(r.result).buyers||[];
  }catch(e){er('추출 오류: '+e.message);btn.disabled=false;btn.textContent='⚡ 바이어 정보 추출';return;}

  // 웹검색 — 병렬 처리 + 25초 타임아웃
  if(doS&&buyers.length>0){
    ld('웹검색 중...', `${buyers.length}명 동시 검색 (최대 25초)`);

    // 전체 인물을 한 번에 검색 (1회 API 호출)
    ld('웹검색 중...', `${buyers.length}명 정보를 한 번에 검색합니다`);

    const buyerList = buyers.map((b,i) =>
      `[${i+1}] ${b.name||'이름없음'} / ${b.company||''} / ${b.title||''}`
    ).join('\n');

    const batchPrompt = `다음 ${buyers.length}명의 인물/기업을 웹 검색하여 최신 정보를 찾아주세요.
아래 규칙을 반드시 준수하세요:

[절대 규칙]
1. 웹 검색으로 직접 확인된 사실만 작성하세요
2. 확인되지 않은 내용은 반드시 null로 표시하세요
3. 추측, 추론, 짐작은 절대 금지입니다
4. "~일 것으로 보인다", "~로 추정된다" 같은 표현 금지
5. 검색해도 정보가 없으면 솔직하게 null
6. 모든 텍스트는 한국어, 날짜(년/월) 반드시 포함

검색 대상:
${buyerList}

응답 형식 (JSON만, 다른 텍스트 없이):
{"results":[
  {"index":1,"recentNews":"검색으로 확인된 최근 뉴스(날짜포함) 또는 null","jobChange":"검색으로 확인된 이직·승진(날짜포함) 또는 null","companyUpdate":"검색으로 확인된 회사동향(날짜포함) 또는 null","kContentLink":"검색으로 확인된 한국콘텐츠협업 또는 null","email":"검색으로 확인된 공식이메일 또는 null","photoUrl":"검색으로 확인된 프로필사진URL 또는 null"},
  {"index":2,...},
  ...
]}`;

    try{
      const batchResult = await callServer({type:'text', prompt:batchPrompt, useSearch:true}, 55000);
      const parsed = parseJSON(batchResult.result);
      const results = parsed.results || [];
      results.forEach(r => {
        const idx = (r.index||1) - 1;
        if(idx >= 0 && idx < buyers.length){
          buyers[idx]._si = r;
          if(r.email && !buyers[idx].email) buyers[idx].email = r.email;
          if(r.photoUrl && !buyers[idx]._ph) buyers[idx]._ph = r.photoUrl;
        }
      });
      console.log('배치 검색 완료:', results.length, '명');
    }catch(e){
      console.warn('배치 검색 실패:', e.message);
    }

  // 이름 기반 이미지 매칭 — 성+이름 모두 포함된 경우만
  buyers.forEach(b=>{
    if(b._ph) return;
    if(!b.name) return;
    const nameLower = b.name.toLowerCase();
    const nameParts = nameLower.split(' ').filter(p=>p.length>2);
    const matched = allImages.find(img=>{
      const cap = (img.caption||'').toLowerCase();
      if(!cap) return false;
      // 성+이름 2개 이상 모두 포함된 경우만 매칭
      const matchCount = nameParts.filter(part=>cap.includes(part)).length;
      return matchCount >= Math.min(2, nameParts.length);
    });
    if(matched) b._nlImg = matched.url;
  });

  ld('결과 정리 중...');
  await new Promise(r=>setTimeout(r,200));
  items=buyers.map((b,i)=>({...b,_id:i}));
  sel=new Set(items.filter(b=>!b.isDuplicate).map(b=>b._id));
  rend();btn.disabled=false;btn.textContent='⚡ 바이어 정보 추출';
}

// ── 렌더링 ────────────────────────────────────────────
function rend(){
  const ni=items.filter(b=>!b.isDuplicate),di=items.filter(b=>b.isDuplicate);
  document.getElementById('cnn').textContent=`신규 ${ni.length}건`;
  document.getElementById('cdd').textContent=`중복 ${di.length}건`;
  document.getElementById('cnn').style.display=ni.length?'inline':'none';
  document.getElementById('cdd').style.display=di.length?'inline':'none';
  document.getElementById('rt').style.display=items.length?'flex':'none';
  if(!items.length){document.getElementById('res').innerHTML=`<div class="es"><div class="ei">🔍</div><div class="et">추출된 바이어가 없습니다</div></div>`;return;}
  const ic={'만화 출판사':'📚','웹툰 플랫폼':'📱','OTT/스트리밍':'📺','방송사':'📡','애니메이션 스튜디오':'🎬','영화·드라마 제작사':'🎥','IP 에이전시':'🏷️'};
  const pc={S:'pS',A:'pA',B:'pB',C:'pC'};
  const pl={S:'S급 최우선',A:'A급 우선',B:'B급',C:'C급'};
  const html=items.map(b=>{
    const icon=ic[b.buyerType]||'🏢',si=b._si;
    const photoSrc=b._ph||(b._nlImg?.url||b._nlImg);
    const av=photoSrc
      ?`<div class="av"><img src="${photoSrc}" onerror="this.parentElement.innerHTML='${icon}'" alt=""><div class="sb">${b._ph?'🔍':'📰'}</div></div>`
      :`<div class="av">${icon}</div>`;
    const infoData=[['기업',b.company,'em'],['직함',b.title,''],['국가',b.country,''],['행사',b.eventMatch,'ev'],['바이어유형',b.buyerType,''],['딜유형',b.dealTypeWebtoon,''],['장르',b.genreInterest,'']].filter(([,v])=>v);
    const emHtml=b.email?`<div class="ef"><span class="el">✉</span><span class="ev2">${b.email}</span></div>`:'';
    const tags=[];
    if(b.interestKContent==='Y')tags.push(['tg-g','🇰🇷 K-콘텐츠 관심']);
    if(b.priorityTier&&b.priorityTier!=='C')tags.push([b.priorityTier==='S'?'tg-g':b.priorityTier==='A'?'tg-p':'',pl[b.priorityTier]]);
    if(si?.jobChange)tags.push(['tg-o',`⚡ ${si.jobChange}`]);
    const tgHtml=tags.length?`<div class="tg">${tags.map(([c,t])=>`<span class="tgi ${c}">${t}</span>`).join('')}</div>`:'';
    const ml=[];
    if(si?.jobChange)ml.push(`<span class="hl">⚡ ${si.jobChange}</span>`);
    if(si?.companyUpdate)ml.push(si.companyUpdate);
    if(si?.recentNews)ml.push(si.recentNews);
    if(si?.kContentLink)ml.push(`<span class="kr">🇰🇷 ${si.kContentLink}</span>`);
    const memoHtml=ml.length?`<div class="sm"><div class="sm-h"><span class="sm-l">🔍 웹검색 최신정보</span><span class="sm-b">AI 검색</span></div><div class="sm-t">${ml.join('<br>')}</div></div>`:'';

    // 교차검증 섹션
    let valHtml='';
    const vd=b._validation;
    if(vd&&vd.sources&&vd.sources.length>0){
      const srcHtml=vd.sources.map(s=>{
        const badge=s.status==='failed'
          ?`<span class="vd-src-badge vs-fail">실패</span>`
          :`<span class="vd-src-badge vs-ok">✓ 확인</span>`;
        const conf=s.confidence?` · 신뢰도: ${s.confidence}`:'';
        let body='';
        if(s.id==='S1') body=`${s.confirmedName||''} / ${s.confirmedTitle||''} @ ${s.confirmedCompany||''}`;
        else if(s.id==='S2') body=`${s.confirmedTitle||s.note||'정보 없음'}${s.sourceUrl?` <a class="vd-url" href="${s.sourceUrl}" target="_blank">${s.sourceUrl.slice(0,40)}...</a>`:''}${conf}`;
        else if(s.id==='S3'){
          const parts=[];
          if(s.recentNews) parts.push(s.recentNews);
          if(s.jobChange) parts.push(`⚡ ${s.jobChange}`);
          if(s.dealMentioned) parts.push(`🤝 ${s.dealMentioned}`);
          if(s.kContentLink) parts.push(`🇰🇷 ${s.kContentLink}`);
          body=parts.join('<br>')||s.note||'정보 없음';
          if(s.sourceUrls&&s.sourceUrls.length){
            body+=`<div class="vd-urls">${s.sourceUrls.slice(0,3).map(u=>`<a class="vd-url" href="${u}" target="_blank">${u.slice(0,50)}</a>`).join('')}</div>`;
          }
        }
        if(s.status==='failed') body=s.note||'검색 실패';
        return `<div class="vd-src"><div class="vd-src-h"><span>${s.icon}</span><span class="vd-src-label">${s.label}</span>${badge}</div><div class="vd-src-body">${body}</div></div>`;
      }).join('');
      const conflictHtml=vd.conflicts&&vd.conflicts.length
        ?`<div class="vd-conflict">⚠️ ${vd.conflicts.join(' / ')}</div>`:'';
      const verifiedCount=vd.sources.filter(s=>s.status==='confirmed').length;
      valHtml=`<div class="vd"><div class="vd-h"><span class="vd-title">✅ 교차검증 ${verifiedCount}/3 소스 확인</span></div><div class="vd-sources">${srcHtml}</div>${conflictHtml}</div>`;
    }
    const acts=b.isDuplicate?`<span class="dbx">⚠ 중복확인</span>`:`<button class="ab ${sel.has(b._id)?'ao':'af'}" onclick="ts(${b._id})">${sel.has(b._id)?'✓ 선택':'+ 추가'}</button>`;
    // 출처 URL 짧게
    const srcShort=b.source?(b.source.length>40?b.source.slice(0,40)+'...':b.source):'';
    return `<div class="card ${b.isDuplicate?'dc':'nc'}" id="c${b._id}">
      <div class="ps ${pc[b.priorityTier]||'pC'}"></div>
      <div class="ct">${av}<div class="ci"><div class="cn2">${b.name||'(담당자 미상)'} <span style="font-size:10px;color:var(--t3);font-weight:400">@ ${b.company||'-'}</span></div><div class="cs">${[b.title,srcShort].filter(Boolean).join(' · ')}</div></div><div class="ca">${acts}</div></div>
      ${infoData.length?`<div class="ir">${infoData.map(([l,v,c])=>`<div class="it"><span class="il">${l}</span><span class="iv ${c}">${v}</span></div>`).join('')}</div>`:''}
      ${emHtml}${tgHtml}${memoHtml}${valHtml}
    </div>`;
  }).join('');
  document.getElementById('res').innerHTML=`<div class="cards">${html}</div>`;
  ue();
}

function ts(id){
  if(sel.has(id))sel.delete(id);else sel.add(id);
  const c=document.getElementById('c'+id),b=c?.querySelector('.ab');
  if(b){if(sel.has(id)){b.className='ab ao';b.textContent='✓ 선택';}else{b.className='ab af';b.textContent='+ 추가';}}
  ue();
}
function sa(){items.filter(b=>!b.isDuplicate).forEach(b=>sel.add(b._id));rend();}
function ue(){const b=document.getElementById('eb');if(b)b.textContent=`✓ 선택 ${sel.size}건 CSV`;}

function ex(){
  const list=items.filter(b=>sel.has(b._id));
  if(!list.length){alert('선택된 항목이 없습니다.');return;}

  // 사용자 DB 포맷: NO / Nationality / Genre / Company / Company introduce / Website / E-mail / 담당자 / 비고
  const hd=['NO','Nationality','Genre','Company','Company introduce','Website','E-mail','담당자','비고'];

  const rows=list.map((b,i)=>{
    const si=b._si;
    // 비고: 웹검색 최신정보 + 한국콘텐츠 이력 통합
    const bigo=[];
    if(si?.jobChange) bigo.push('⚡ '+si.jobChange);
    if(si?.recentNews) bigo.push(si.recentNews);
    if(si?.companyUpdate) bigo.push(si.companyUpdate);
    if(si?.kContentLink) bigo.push('🇰🇷 '+si.kContentLink);
    bigo.push('⚠️ 뉴스레터 자동 추출 — 발송 전 확인 필요');

    // 담당자: 이름 + 직함
    const person=[b.name, b.title].filter(Boolean).join(' / ');

    // Company introduce: 바이어유형 + 콘텐츠 분야 + 딜유형
    const intro=[b.buyerType, b.contentFocus, b.dealTypeWebtoon].filter(Boolean).join(' | ');

    return{
      'NO': String(i+1),
      'Nationality': b.country||'',
      'Genre': b.genreInterest||'',
      'Company': b.company||'',
      'Company introduce': intro,
      'Website': b.website||'',
      'E-mail': b.email||'',
      '담당자': person,
      '비고': bigo.join(' / ')
    };
  });

  const csv='\uFEFF'+[hd.join(','),...rows.map(r=>hd.map(h=>`"${String(r[h]||'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),download:`buyers_${new Date().toISOString().slice(0,10)}.csv`});
  a.click();
}
</script>
</body>
</html>
